name: GPU smoke

# Manual only: GitHub-hosted runners do not have a GPU, and the model pack is too large to
# commit. The job expects a self-hosted runner with the labels `self-hosted` and `gpu`, plus a
# working CUDA/CuPy installation. See docs/CI.md.
on:
  workflow_dispatch:
    inputs:
      pack:
        description: Absolute path to a converted Kindi pack on the runner
        required: true
        type: string

permissions:
  contents: read

jobs:
  verify-and-serve:
    name: GPU verify and server boundary
    runs-on: [self-hosted, gpu]
    timeout-minutes: 45
    env:
      KINDI_PACK: ${{ inputs.pack }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test dependencies
        run: python -m pip install -r tests/requirements-test.txt
      - name: Verify the pack token-for-token
        run: python -m kindi verify
      - name: Start the server and check /health and chat
        run: |
          python -m kindi serve --host 127.0.0.1 --port 8199 > "$RUNNER_TEMP/kindi-server.log" 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT
          for i in $(seq 1 120); do
            if python -c 'import json, urllib.request; r = urllib.request.urlopen("http://127.0.0.1:8199/health", timeout=2); assert json.load(r)["ok"] is True'; then
              break
            fi
            sleep 2
          done
          python -c 'import json, urllib.request; body = {"messages": [{"role": "user", "content": "Reply with OK."}], "max_tokens": 8, "temperature": 0}; req = urllib.request.Request("http://127.0.0.1:8199/v1/chat/completions", data=json.dumps(body).encode(), headers={"Content-Type": "application/json"}); response = json.load(urllib.request.urlopen(req, timeout=120)); assert response["choices"][0]["message"]["content"]'
      - name: Upload the server log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: kindi-gpu-server-log
          path: ${{ runner.temp }}/kindi-server.log
