name: CI

# The no-GPU gate from AGENTS.md: the installer parses, the installer passes ShellCheck, every
# module compiles and the CPU-only test suite passes. A separate job compiles and loads kcpu.c.
# No CUDA, CuPy or model pack is used; the plan-engine test (tests/test_plan_engine.py) imports its
# modules with a stand-in cupy.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  cpu-tests:
    name: CPU tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test dependencies
        # tests/test_server.py needs FastAPI + httpx; tests/test_plan_engine.py needs numpy only
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r tests/requirements-test.txt
      - name: Compile every module
        run: python -m compileall -q kindi
      - name: Run the CPU-only suite
        run: python -m pytest tests/ -q

  cpu-engine-smoke:
    name: CPU engine build and smoke
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r tests/requirements-test.txt
      - name: Compile kcpu.c for the supported x86-64 tier
        env:
          KINDI_CPU_CACHE: ${{ runner.temp }}/kcpu
        run: |
          gcc --version
          mkdir -p "$KINDI_CPU_CACHE"
          gcc -O3 -mavx2 -mfma -mf16c -fopenmp -fno-math-errno -shared -fPIC \
            -o "$KINDI_CPU_CACHE/libkcpu.so" kindi/kcpu.c -lm
          file "$KINDI_CPU_CACHE/libkcpu.so"
      - name: Run the CPU engine checks
        env:
          KINDI_CPU_CACHE: ${{ runner.temp }}/kcpu
          KINDI_CPU_SMOKE: "1"
        run: |
          python -m pytest tests/test_cpu_build.py tests/test_cpu_threads.py tests/test_cpu_smoke.py -q

  windows-cpu:
    name: Windows CPU and config boundary
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test dependencies
        run: python -m pip install -r tests/requirements-test.txt
      - name: Compile every module
        run: python -m compileall -q kindi
      - name: Run the Windows-safe boundary tests
        run: >
          python -m pytest -q
          tests/test_config.py
          tests/test_config_example.py
          tests/test_config_reference.py
          tests/test_cpu_build.py
          tests/test_cpu_features.py
          tests/test_cpu_threads.py
          tests/test_startup.py
          tests/test_tokenizer.py

  installer-shell:
    name: Installer shell checks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Install ShellCheck
        run: command -v shellcheck >/dev/null || { sudo apt-get update && sudo apt-get install -y shellcheck; }
      - name: Parse the installer
        run: bash -n install.sh
      - name: ShellCheck
        # warnings and errors fail; info/style findings (SC1091, SC2001, SC2086) do not.
        # The committed LF blob is checked, not the working file: a Windows checkout with
        # core.autocrlf=true has a CRLF install.sh, which ShellCheck rejects with SC1017.
        run: |
          git show HEAD:install.sh > "$RUNNER_TEMP/install.sh"
          shellcheck --severity=warning --exclude=SC2221,SC2222 "$RUNNER_TEMP/install.sh"
