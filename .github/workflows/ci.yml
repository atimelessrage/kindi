name: CI

# The no-GPU gate from AGENTS.md: the installer parses, the installer passes ShellCheck, every
# module compiles and the CPU-only test suite passes. A separate job compiles and loads kcpu.c.
# No CUDA, CuPy or model pack is used; the plan-engine test (tests/test_plan_engine.py) imports its
# modules with a stand-in cupy.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  cpu-tests:
    name: CPU tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.11"
      - name: Install test dependencies
        # tests/test_server.py needs FastAPI + httpx; tests/test_plan_engine.py needs numpy only
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r tests/requirements-test.txt
      - name: Compile every module
        run: python -m compileall -q kindi
      - name: Python lint and type-check ratchet
        # Legacy findings are recorded in tools/python_quality_baseline.json; this fails only
        # when Ruff, mypy, Pyright or Pylint finds something new.
        run: python tools/check_python_quality.py
      - name: Documentation, claims and generated-reference gates
        # These four are the CPU-only gates the handoff names but CI did not run. Keep them in
        # this job: a stale generated reference or an unclaimed benchmark number must fail here.
        run: |
          python tools/check_claims.py
          python scripts/check_ternary_moe.py
          python tools/project_memory.py --check
          python -m kindi.config_reference --check
          python -m kindi.support_matrix --check
      - name: Run the CPU-only suite with coverage floor
        run: >
          python -m pytest tests/ -q
          --cov=kindi --cov-branch --cov-report=term --cov-report=json:coverage.json
          --cov-fail-under=27
      - name: Per-module coverage floors (CPU-verifiable modules)
        run: python tools/check_coverage.py
      - name: Perf baseline gate (recorded CROSS-MODE numbers)
        run: python tools/check_perf_baseline.py

  dependency-audit:
    name: Dependency audit (report-only)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.11"
      - name: Audit pinned dependencies
        # Report-only until the first reviewed baseline lands. --no-deps keeps the legacy
        # CUDA 10.2 pins auditable even when they cannot resolve on this runner.
        run: |
          python -m pip install --upgrade pip pip-audit==2.10.1
          pip-audit -r tests/requirements-test.txt --format json --output test-audit.json || true
          pip-audit -r requirements-runtime.txt --no-deps --format json --output runtime-audit.json || true
          python tools/check_dependencies.py --report test-audit.json --report runtime-audit.json --allow-missing --report-only

  cpu-engine-smoke:
    name: CPU engine build and smoke
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.11"
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r tests/requirements-test.txt
      - name: Compile kcpu.c for the supported x86-64 tier
        env:
          KINDI_CPU_CACHE: ${{ runner.temp }}/kcpu
        run: |
          gcc --version
          mkdir -p "$KINDI_CPU_CACHE"
          SO=$(python -c 'from kindi.cpu import _so_path; print(_so_path())')
          gcc -O3 -mavx2 -mfma -mf16c -fopenmp -fno-math-errno -shared -fPIC \
            -o "$SO" kindi/kcpu.c -lm
          file "$SO"
      - name: Run the CPU engine checks
        env:
          KINDI_CPU_CACHE: ${{ runner.temp }}/kcpu
          KINDI_CPU_SMOKE: "1"
        run: |
          python -m pytest tests/test_cpu_build.py tests/test_cpu_threads.py tests/test_cpu_smoke.py -q

  windows-cpu:
    name: Windows CPU and config boundary
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.11"
      - name: Install test dependencies
        run: python -m pip install -r tests/requirements-test.txt
      - name: Compile every module
        run: python -m compileall -q kindi
      - name: Run the Windows-safe boundary tests
        run: >
          python -m pytest -q
          tests/test_config.py
          tests/test_config_example.py
          tests/test_config_reference.py
          tests/test_cpu_build.py
          tests/test_cpu_features.py
          tests/test_cpu_threads.py
          tests/test_startup.py
          tests/test_tokenizer.py

  installer-shell:
    name: Installer shell checks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - name: Install ShellCheck
        run: command -v shellcheck >/dev/null || { sudo apt-get update && sudo apt-get install -y shellcheck; }
      - name: Parse the installer
        run: bash -n install.sh
      - name: ShellCheck
        # warnings and errors fail; info/style findings (SC1091, SC2001, SC2086) do not.
        # The committed LF blob is checked, not the working file: a Windows checkout with
        # core.autocrlf=true has a CRLF install.sh, which ShellCheck rejects with SC1017.
        run: |
          git show HEAD:install.sh > "$RUNNER_TEMP/install.sh"
          shellcheck --severity=warning --exclude=SC2221,SC2222 "$RUNNER_TEMP/install.sh"

  static-analysis:
    name: CUDA static analysis
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.11"
      - name: Install analysers and numpy
        run: |
          sudo apt-get update
          sudo apt-get install -y cppcheck clang-tidy-18
          python -m pip install "numpy>=1.19,<3"
      - name: Run cppcheck and clang-tidy over the CUDA translation units
        env:
          CLANG_TIDY: clang-tidy-18
        run: python tests/static/run_static_analysis.py

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          fetch-depth: 0          # the history scan needs every commit, not a shallow tip
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.11"
      - name: Install detect-secrets and pre-commit
        run: python -m pip install "detect-secrets==1.5.0" "pre-commit==3.7.1"
      - name: Verify the baseline matches the tracked tree
        run: python tools/check_secret_baseline.py --check
      - name: Validate the local hook configuration
        run: pre-commit validate-config .pre-commit-config.yaml
      - name: Scan tracked files against the baseline
        run: |
          git ls-files -z | xargs -0 detect-secrets-hook --baseline .secrets.baseline
      - name: Scan git history for credentials and personal data
        run: python tools/check_secret_history.py

  bridge-smoke:
    name: Bridge smoke tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.11"
      - name: Run the bundled Bridge smoke suite
        working-directory: bridge
        run: python -m unittest discover -s tests -v
