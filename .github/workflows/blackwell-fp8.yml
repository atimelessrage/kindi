name: Blackwell FP8 verification

# Manual only: GitHub-hosted runners do not expose an sm_100/sm_120 device. The runner must have
# the labels `self-hosted`, `gpu` and the selected architecture (`sm_100` or `sm_120`), a working
# NVIDIA driver and the CuPy build used by this repository. See docs/CI.md. Dispatch once per
# architecture (sm_100, then sm_120) to cover both Blackwell variants.
on:
  workflow_dispatch:
    inputs:
      arch:
        description: Blackwell architecture to require (selects its runner label)
        required: true
        default: sm_100
        type: choice
        options:
          - sm_100
          - sm_120

permissions:
  contents: read

jobs:
  verify-native-fp8:
    name: Native FP8 on ${{ inputs.arch }}
    runs-on: [self-hosted, gpu, "${{ inputs.arch }}"]
    timeout-minutes: 20
    env:
      KINDI_G4_FP8: "1"
      KINDI_BLACKWELL_OUT: ${{ runner.temp }}/blackwell-fp8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.11"
      - name: Install test dependencies
        run: python -m pip install -r tests/requirements-test.txt
      - name: Verify the native FP8 kernels
        run: >-
          python tools/verify_blackwell_fp8.py
          --arch "${{ inputs.arch }}"
          --out "$KINDI_BLACKWELL_OUT"
      - name: Upload the Blackwell result
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: kindi-blackwell-fp8-${{ inputs.arch }}
          path: ${{ env.KINDI_BLACKWELL_OUT }}
          if-no-files-found: warn
