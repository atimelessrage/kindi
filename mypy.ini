# First-party production type checking. Third-party CUDA/model packages are not
# installed on the CPU CI runner, so missing imports are ignored; errors in local
# code are still checked. The measured legacy debt is ratcheted by
# tools/check_python_quality.py.
[mypy]
python_version = 3.10
ignore_missing_imports = True
show_error_codes = True
pretty = False
warn_unused_configs = True
